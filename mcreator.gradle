repositories {
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://mvn.devos.one/snapshots" } // Registrate
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // ForgeConfigAPIPort
    exclusiveContent { // Sable Companion: optional Sable (physics sub-levels) compatibility API
        forRepository { maven { url = "https://maven.ryanhcode.dev/releases" } }
        filter { includeGroup("dev.ryanhcode.sable-companion"); includeGroup("dev.ryanhcode.sable") }
    }
    exclusiveContent { // Veil: rendering library required by Sable (only used by the -PwithSable dev run)
        forRepository { maven { url = "https://maven.blamejared.com" } }
        filter { includeGroup("foundry.veil") }
    }
}

dependencies {
    implementation("com.simibubi.create:create-1.21.1:6.0.6-98:slim") { transitive = false }
    implementation("net.createmod.ponder:Ponder-NeoForge-1.21.1:1.0.56")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.4")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.4")
    implementation("com.tterrag.registrate:Registrate:MC1.21-1.3.0+62")
    // Bundled (Jar-in-Jar). Without Sable it answers "no sub-level" and identity transforms; with Sable it delegates to Sable.
    jarJar(implementation("dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:[1.6.0,)")) { version { prefer("1.6.0") } }
    // Test with the real Sable in the dev run only: ./gradlew runClient -PwithSable (never shipped)
    if (project.hasProperty("withSable"))
        runtimeOnly("dev.ryanhcode.sable:sable-neoforge-1.21.1:2.0.6") {
            // Veil's own libraries are bundled inside the Veil jar
            exclude group: "gg.moonflower"
            exclude group: "io.github.ocelot"
        }
}


